<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="تواصل مع فريق موقع اختبر دماغك.">
  <title>تواصل معنا - اختبر دماغك 🧠</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #f5f7fb;
      color: #222;
      line-height: 1.9;
    }
    .container {
      width: min(900px, 92%);
      margin: 30px auto;
    }
    .card {
      background: #fff;
      padding: 28px;
      border-radius: 18px;
      box-shadow: 0 6px 24px rgba(0,0,0,.08);
    }
    h1 { margin-top: 0; }
    .note {
      background: #f1f4ff;
      padding: 15px;
      border-radius: 12px;
    }
    a { color: #315efb; }
    .back {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>تواصل معنا 📩</h1>

      <p>
        عندك اقتراح لسؤال جديد؟ لقيت مشكلة في الموقع؟ أو عندك ملاحظة حابب تشاركها؟
        يسعدنا نسمع منك.
      </p>

      <div class="note">
        <strong>ملاحظة:</strong>
        هنضيف وسيلة التواصل المباشرة هنا بعد تجهيزها.
      </div>

      <h2>اقتراحات وملاحظات</h2>
      <p>
        يمكنك إرسال اقتراحاتك أو ملاحظاتك من خلال وسيلة التواصل التي سيتم وضعها
        في هذه الصفحة.
      </p>

      <a class="back" href="index.html">← الرجوع إلى الصفحة الرئيسية</a>
    </section>
  </main>
</body>
</html>
